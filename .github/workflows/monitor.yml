name: ICAI Batch Monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - debug
          - test-email
          - test-telegram

permissions:
  contents: write   # needed to commit users.json back to repo

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Email monitor (existing) ────────────────────────────────────────────
      - name: Run email monitor
        if: ${{ github.event.inputs.mode != 'test-telegram' }}
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          ALERT_EMAIL:    ${{ secrets.ALERT_EMAIL }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "debug" ]; then
            python monitor.py --debug
          elif [ "${{ github.event.inputs.mode }}" = "test-email" ]; then
            python monitor.py --test-email
          else
            python monitor.py
          fi

      # ── Telegram bot ────────────────────────────────────────────────────────
      - name: Run Telegram bot
        if: env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test-telegram" ]; then
            python -c "
          import os, requests
          token = os.environ['TELEGRAM_BOT_TOKEN']
          r = requests.get(f'https://api.telegram.org/bot{token}/getMe')
          print('Bot info:', r.json())
          "
          else
            python bot.py
          fi

      # ── Commit updated users.json ────────────────────────────────────────────
      - name: Commit users.json if changed
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add users.json
          git diff --cached --quiet || git commit -m "chore: update users.json [skip ci]"
          git push
