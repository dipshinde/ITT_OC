name: ICAI Batch Email Monitor

# Runs every 10 minutes via GitHub Actions to send email alerts.
# The Railway-deployed Telegram bot handles Telegram notifications separately.
# Both share the same MongoDB database for batch state.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - debug
          - test-email

permissions:
  contents: read   # read-only — no more committing state files to the repo

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run email monitor
        env:
          MONGODB_URI:    ${{ secrets.MONGODB_URI }}
          MONGODB_DB:     ${{ secrets.MONGODB_DB }}
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          ALERT_EMAIL:    ${{ secrets.ALERT_EMAIL }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "debug" ]; then
            python monitor.py --debug
          elif [ "${{ github.event.inputs.mode }}" = "test-email" ]; then
            python monitor.py --test-email
          else
            python monitor.py
          fi
