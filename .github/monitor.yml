name: ICAI Batch Monitor

on:
  schedule:
    # Runs every 10 minutes
    # GitHub Actions minimum interval is 5 minutes
    # Note: free for public repos (unlimited minutes)
    - cron: "*/10 * * * *"

  # Allow manual trigger from GitHub Actions UI (useful for testing)
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - debug
          - test-email

jobs:
  monitor:
    name: Check ICAI Batches
    runs-on: ubuntu-latest
    # Required so the job can commit state.json back to the repo
    permissions:
      contents: write

    steps:
      # ── 1. Checkout repo ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the token that has write access
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Set up Python ────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run the monitor ──────────────────────────────────────────────────
      - name: Run monitor (normal)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'normal' }}
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          ALERT_EMAIL:    ${{ secrets.ALERT_EMAIL }}
        run: python monitor.py

      - name: Run monitor (debug)
        if: ${{ github.event.inputs.mode == 'debug' }}
        run: python monitor.py --debug

      - name: Send test email
        if: ${{ github.event.inputs.mode == 'test-email' }}
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          ALERT_EMAIL:    ${{ secrets.ALERT_EMAIL }}
        run: python monitor.py --test-email

      # ── 5. Commit updated state.json back to repo ───────────────────────────
      # This is how state persists between runs — no external database needed.
      - name: Commit state
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'normal' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          # Only commit if state.json actually changed
          git diff --staged --quiet || git commit -m "chore: update batch state [$(date -u '+%Y-%m-%d %H:%M')] [skip ci]"
          git push
